<!-- Фрагмент раздела: planner
     Этот файл — копия разметки для удобного редактирования в Visual Studio.
     Рабочая разметка подключена в index.html (id="section-planner").
     После правок скопируйте содержимое обратно в index.html внутрь section-planner.
-->
<section class="section" id="section-planner">

                <div class="flex-between mb-24 flex-wrap gap-12">
                    <div class="flex gap-8 align-center">
                        <input type="date" class="form-control" id="plannerDate" style="width:auto;">
                        <button class="btn btn-secondary btn-sm" id="plannerToday">Сегодня</button>
                    </div>
                    <div class="flex gap-8">
                        <button class="btn btn-outline btn-sm" id="applyTemplateBtn">Шаблон</button>
                        <button class="btn btn-primary btn-sm" id="addPlanItemBtn">+ Занятие</button>
                    </div>
                </div>
                <div class="card">
                    <div id="plannerTimeline"></div>
                </div>
            
</section>
